name: Update Top 1M Domains

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-top1m-domains:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest Top 1M domains
        run: |
          mkdir -p assets
          curl -L "https://tranco-list.eu/top-1m.csv.zip" -o assets/top-1m.csv.zip
          unzip -o assets/top-1m.csv.zip -d assets
          rm assets/top-1m.csv.zip
          echo "TAG_NAME=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/top-1m.csv
          git commit -m "Update Top 1M domains ${{ env.TAG_NAME }}"
          git push

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2